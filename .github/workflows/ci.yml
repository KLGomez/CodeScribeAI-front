name: CI - Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Typecheck and Build
        env:
          VITE_API_URL: https://api.codescribe.example.com/api
        run: npm run build

      - name: Build Docker image
        run: docker build --build-arg VITE_API_URL=https://api.codescribe.example.com/api -t codescribe-frontend .
